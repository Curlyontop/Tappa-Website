<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tappa Support</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .chatbot {
      max-width: 500px;
      height: 100vh;
      max-height: 750px;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111;
      color: white;
      padding: 22px;
    }

    .header h2 {
      margin: 0 0 5px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.8;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .bot {
      background: #eeeeee;
      color: #111;
      margin-right: auto;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      background: #111;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 15px;
    }

    button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div class="chatbot">

  <div class="header">
    <h2>Tappa Support 👋</h2>
    <p>Simple NFC Google Review cards</p>
  </div>

  <div class="messages" id="messages">

    <div class="message bot">
      Kia ora! 👋 Welcome to Tappa.

      I'm here to answer questions about our Google Review cards, pricing, how they work and contacting us.

      What would you like to know?
    </div>

  </div>

  <div class="input-area">
    <input
      id="userInput"
      type="text"
      placeholder="Ask Tappa something..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

const responses = [

  {
    keywords: ["price", "cost", "how much", "pricing", "$40", "40"],
    reply:
      "Our Tappa Google Review cards are $40 each. 💳\n\nIf you'd like to order one, just let us know!"
  },

  {
    keywords: ["what is tappa", "what's tappa", "what do you do", "about tappa", "tappa"],
    reply:
      "Tappa makes simple NFC Google Review cards for businesses. ⭐\n\nCustomers can tap the card with their phone and quickly get taken to your Google review page."
  },

  {
    keywords: ["how does it work", "how it works", "how does the card work", "work"],
    reply:
      "It's really simple! 📱\n\n1. A customer taps their phone on the Tappa card.\n2. Their phone opens the business's Google review page.\n3. They can leave a review.\n\nNo app is required."
  },

  {
    keywords: ["google review", "reviews", "review"],
    reply:
      "Tappa makes it easier for your customers to leave Google reviews. ⭐\n\nThe card uses NFC, so customers can simply tap their phone and be taken to your review page."
  },

  {
    keywords: ["nfc", "tap", "phone"],
    reply:
      "Tappa uses NFC technology. 📱\n\nMost modern smartphones can simply be brought close to the card to open the link."
  },

  {
    keywords: ["contact", "contact you", "message", "available", "hours", "time"],
    reply:
      "Our usual contact hours are:\n\n🗓️ Weekdays: 3:00 PM – 8:00 AM the next day\n🗓️ Weekends: Anytime\n\nIf you message outside those hours, we'll get back to you when we're available."
  },

  {
    keywords: ["order", "buy", "purchase", "get one", "want one"],
    reply:
      "Sweet! 🙌 If you'd like to order a Tappa card, send us a message with what you need and we'll help you out."
  },

  {
    keywords: ["shipping", "delivery", "deliver"],
    reply:
      "For delivery or pickup questions, send us a message and we'll let you know what's available for your area."
  },

  {
    keywords: ["hello", "hi", "hey", "kia ora", "yo", "sup"],
    reply:
      "Kia ora! 👋 What can I help you with?"
  },

  {
    keywords: ["thanks", "thank you", "cheers"],
    reply:
      "No worries! 🤝 If you have any other questions about Tappa, just ask."
  },

  {
    keywords: ["who runs", "owner", "run by", "business owner"],
    reply:
      "Tappa is a young Aotearoa-owned business, run by a young entrepreneur who wanted to make getting Google reviews easier for local businesses. 🇳🇿"
  }

];


function addMessage(text, type) {

  const messages = document.getElementById("messages");

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;
}


function findResponse(text) {

  const lowerText = text.toLowerCase();

  for (const item of responses) {

    for (const keyword of item.keywords) {

      if (lowerText.includes(keyword)) {
        return item.reply;
      }

    }

  }

  return "Kia ora! 👋 I'm not sure about that one yet.\n\nTry asking me about Tappa, pricing, Google reviews, how the card works, NFC, ordering, or our contact hours.";
}


function sendMessage() {

  const input = document.getElementById("userInput");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(function() {

    const reply = findResponse(text);

    addMessage(reply, "bot");

  }, 400);

}


document.getElementById("userInput").addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
