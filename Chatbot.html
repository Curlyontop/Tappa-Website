<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tappa Support</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f9fa;
  color: #202124;
}

.chatbot {
  width: 100%;
  max-width: 520px;
  height: 100vh;
  max-height: 800px;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */

.header {
  padding: 22px;
  color: white;
  background: linear-gradient(
    135deg,
    #4285f4,
    #34a853,
    #fbbc05,
    #ea4335
  );
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 44px;
  height: 44px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #4285f4;
  font-size: 20px;
}

.header h1 {
  margin: 0;
  font-size: 21px;
}

.header p {
  margin: 4px 0 0;
  font-size: 13px;
}

/* CHAT */

.messages {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.message {
  max-width: 86%;
  padding: 13px 15px;
  margin-bottom: 12px;
  border-radius: 18px;
  line-height: 1.45;
  white-space: pre-line;
  word-wrap: break-word;
}

.bot {
  background: #f1f3f4;
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

.user {
  background: #4285f4;
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

/* QUICK BUTTONS */

.quick {
  display: flex;
  gap: 8px;
  padding: 0 15px 10px;
  overflow-x: auto;
}

.quick button {
  white-space: nowrap;
  border: 1px solid #dadce0;
  background: white;
  border-radius: 20px;
  padding: 9px 13px;
  font-size: 13px;
  cursor: pointer;
}

.quick button:hover {
  background: #f1f3f4;
}

/* TYPING */

.typing {
  display: none;
  width: fit-content;
  background: #f1f3f4;
  padding: 12px 15px;
  border-radius: 18px;
  margin: 0 18px 12px;
}

.dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #777;
  border-radius: 50%;
  margin: 0 2px;
  animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
  animation-delay: .2s;
}

.dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes bounce {
  0%, 60%, 100% {
    transform: translateY(0);
  }

  30% {
    transform: translateY(-5px);
  }
}

/* INPUT */

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #dadce0;
}

input {
  flex: 1;
  min-width: 0;
  border: 1px solid #dadce0;
  border-radius: 24px;
  padding: 13px 16px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #4285f4;
}

.send {
  border: none;
  border-radius: 50%;
  width: 46px;
  height: 46px;
  background: #4285f4;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #777;
  padding: 6px;
}
</style>
</head>

<body>

<div class="chatbot">

  <div class="header">
    <div class="header-top">

      <div class="logo">T</div>

      <div>
        <h1>Tappa Support</h1>
        <p>Here to help with your Google Review cards</p>
      </div>

    </div>
  </div>

  <div class="messages" id="messages">

    <div class="message bot">
Kia ora! 👋 Welcome to Tappa.

I'm Tappa's online assistant. I can help with prices, how the cards work, Google Reviews, NFC, ordering, delivery, meetings, our guarantee and contacting us.

What would you like to know?
    </div>

  </div>

  <div class="quick">

    <button onclick="quickQuestion('How much are the cards?')">
      💰 Prices
    </button>

    <button onclick="quickQuestion('How does Tappa work?')">
      📱 How it works
    </button>

    <button onclick="quickQuestion('Do you deliver?')">
      🚚 Delivery
    </button>

    <button onclick="quickQuestion('What is your guarantee?')">
      ♾️ Guarantee
    </button>

    <button onclick="quickQuestion('How can I contact Tappa?')">
      📞 Contact
    </button>

  </div>

  <div class="typing" id="typing">

    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

  </div>

  <div class="input-area">

    <input
      id="userInput"
      type="text"
      placeholder="Ask Tappa anything..."
      autocomplete="off"
    >

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

  <div class="footer">
    Tappa • Aotearoa 🇳🇿
  </div>

</div>


<script>

/* =========================
   CONVERSATION MEMORY
========================= */

let lastTopic = null;


/* =========================
   TAPPA INFORMATION
========================= */

const tappa = {

  business:
    "Tappa is a young Aotearoa-owned business that provides NFC Google Review cards to help local businesses make it easier for customers to leave Google reviews.",

  pricing:
    "💳 1 card — $30\n💳 2 cards — $50\n💬 3 or more — price negotiated\n\nFor 3+ cards, we'd prefer to meet with you and work out the best option.",

  howItWorks:
    "Tappa uses NFC technology. 📱 A customer brings their compatible phone close to the Tappa card and it opens the business's Google Review link. They can then leave a review. No special app is required.",

  delivery:
    "Yep! 🚚 Tappa can deliver, and pickup can also be arranged.\n\nWe actually prefer to meet with a business beforehand so we can get to know them, understand what they need and make sure everything is set up properly.",

  guarantee:
    "Tappa offers a forever guarantee. ♾️\n\nIf your card breaks or stops working, we'll fix it. If there's a problem that can't be fixed, we'll refund you.\n\nAnd if you simply don't like it, you can also get your money back.",

  contact:
    "You can contact Tappa here:\n\n📧 Tappa.Aotearoa@gmail.com\n📱 027 275 5475\n\n🗓️ Weekdays: 3:00 PM–8:00 AM the next day\n🗓️ Weekends: Anytime.",

  meeting:
    "We prefer to have a meeting beforehand. 🤝\n\nIt's a chance for Tappa to get to know the business, understand what you need and make sure the card is set up correctly.",

  fallback:
    "Kia ora! 👋 I'm not sure about that one, and I don't want to give you the wrong information.\n\nPlease contact the Tappa team and we'll be able to help you properly.\n\n📧 Tappa.Aotearoa@gmail.com\n📱 027 275 5475\n\n🗓️ Weekdays: 3:00 PM–8:00 AM the next day\n🗓️ Weekends: Anytime."

};


/* =========================
   HELPERS
========================= */

function cleanText(text) {

  return text
    .toLowerCase()
    .replace(/[?!.,]/g, "")
    .replace(/\s+/g, " ")
    .trim();

}


function hasAny(text, words) {

  return words.some(word => text.includes(word));

}


function remember(topic) {

  lastTopic = topic;

}


/* =========================
   MAIN RESPONSE ENGINE
========================= */

function getResponse(originalText) {

  const text = cleanText(originalText);


  /* GREETINGS */

  if (hasAny(text, [
    "hello",
    "hi",
    "hey",
    "kia ora",
    "morena",
    "yo",
    "sup",
    "gday",
    "good morning",
    "good afternoon",
    "good evening"
  ])) {

    remember("greeting");

    return "Kia ora! 👋 How can I help you with Tappa today?";

  }


  /* THANKS */

  if (hasAny(text, [
    "thanks",
    "thank you",
    "cheers",
    "appreciate it"
  ])) {

    return "No worries! 🤝 If you have another question about Tappa, just ask.";

  }


  /* =========================
     FOLLOW-UP QUESTIONS
  ========================= */


  /*
    "What about two?"
    "And three?"
    "What about five?"
  */

  if (
    lastTopic === "pricing" &&
    hasAny(text, [
      "one",
      "1",
      "two",
      "2",
      "three",
      "3",
      "four",
      "4",
      "five",
      "5",
      "six",
      "6",
      "seven",
      "7",
      "eight",
      "8",
      "nine",
      "9",
      "ten",
      "10"
    ])
  ) {

    if (hasAny(text, ["one", "1"])) {

      return "Yep! 💰 1 Tappa card is $30.";

    }

    if (hasAny(text, ["two", "2"])) {

      return "Yep! 💰 2 Tappa cards are $50.";

    }

    return "For 3 or more Tappa cards, the price is negotiated depending on what the business needs. 💬\n\nWe'd prefer to meet with you first and work out the best option.";

  }


  /* =========================
     PRICING
  ========================= */

  if (hasAny(text, [
    "price",
    "prices",
    "cost",
    "costs",
    "how much",
    "pricing",
    "card price",
    "card cost",
    "expensive",
    "cheap",
    "afford"
  ])) {

    remember("pricing");

    if (hasAny(text, [
      "one card",
      "1 card",
      "single card",
      "just one"
    ])) {

      return "💰 1 Tappa card is $30.";

    }

    if (hasAny(text, [
      "two cards",
      "2 cards",
      "two card",
      "2 card"
    ])) {

      return "💰 2 Tappa cards are $50.";

    }

    if (hasAny(text, [
      "three",
      "3",
      "four",
      "4",
      "five",
      "5",
      "bulk",
      "multiple"
    ])) {

      return "For 3 or more Tappa cards, the price is negotiated depending on what the business needs. 💬\n\nWe'd prefer to meet with you first and work out the best option.";

    }

    return tappa.pricing;

  }


  /* =========================
     WHAT IS TAPPA
  ========================= */

  if (hasAny(text, [
    "what is tappa",
    "whats tappa",
    "what does tappa do",
    "what do you do",
    "tell me about tappa",
    "about tappa",
    "who are you"
  ])) {

    remember("business");

    return tappa.business;

  }


  /* =========================
     HOW IT WORKS
  ========================= */

  if (hasAny(text, [
    "how does it work",
    "how it works",
    "how do they work",
    "how does the card work",
    "how do the cards work",
    "how do i use it",
    "how do i use the card",
    "what happens when i tap",
    "what happens if i tap"
  ])) {

    remember("howItWorks");

    return tappa.howItWorks;

  }


  /* =========================
     NFC
  ========================= */

  if (hasAny(text, [
    "nfc",
    "near field",
    "tap phone",
    "tap my phone",
    "phone tap",
    "tap the card"
  ])) {

    remember("nfc");

    return "Tappa uses NFC technology. 📱\n\nA compatible phone can be brought close to the card, which opens the business's Google Review link.";

  }


  /* =========================
     GOOGLE REVIEWS
  ========================= */

  if (hasAny(text, [
    "google review",
    "google reviews",
    "google rating",
    "reviews",
    "review",
    "get more reviews",
    "customer reviews"
  ])) {

    remember("reviews");

    return "Tappa is designed to make leaving Google reviews easier. ⭐\n\nCustomers can tap the Tappa card and be taken directly to the business's Google Review link instead of having to search for it.";

  }


  /* =========================
     DELIVERY
  ========================= */

  if (hasAny(text, [
    "delivery",
    "deliver",
    "shipping",
    "ship",
    "drop off",
    "drop it off"
  ])) {

    remember("delivery");

    return tappa.delivery;

  }


  /* =========================
     PICKUP
  ========================= */

  if (hasAny(text, [
    "pickup",
    "pick up",
    "collect",
    "collection"
  ])) {

    remember("delivery");

    return "Yep! 👍 Pickup can be arranged.\n\nWe can also deliver. We actually prefer to meet beforehand so we can get to know the business and make sure everything is set up properly.";

  }


  /* =========================
     MEETING
  ========================= */

  if (hasAny(text, [
    "meeting",
    "meet",
    "visit",
    "come in",
    "come over",
    "in person",
    "talk in person"
  ])) {

    remember("meeting");

    return tappa.meeting;

  }


  /* =========================
     GUARANTEE
  ========================= */

  if (hasAny(text, [
    "warranty",
    "guarantee",
    "refund",
    "money back",
    "broken",
    "breaks",
    "stopped working",
    "doesnt work",
    "doesn't work",
    "not working",
    "faulty"
  ])) {

    remember("guarantee");

    return tappa.guarantee;

  }


  /* =========================
     CONTACT
  ========================= */

  if (hasAny(text, [
    "contact",
    "email",
    "phone number",
    "phone",
    "number",
    "call",
    "get in touch",
    "message you"
  ])) {

    remember("contact");

    return tappa.contact;

  }


  /* =========================
     HOURS
  ========================= */

  if (hasAny(text, [
    "hours",
    "opening hours",
    "when can i contact",
    "when are you available",
    "available",
    "when are you open",
    "what time",
    "are you open"
  ])) {

    remember("hours");

    return "Our contact hours are:\n\n🗓️ Weekdays: 3:00 PM–8:00 AM the next day\n🗓️ Weekends: Anytime.";

  }


  /* =========================
     ORDERING
  ========================= */

  if (hasAny(text, [
    "order",
    "buy",
    "purchase",
    "get a card",
    "get one",
    "want one",
    "i need a card",
    "i want a card"
  ])) {

    remember("ordering");

    return "Sweet! 🙌 We'd prefer to meet with you first, get to know your business and work out exactly what you need.\n\nYou can contact Tappa here:\n📧 Tappa.Aotearoa@gmail.com\n📱 027 275 5475";

  }


  /* =========================
     WHO RUNS TAPPA
  ========================= */

  if (hasAny(text, [
    "who runs tappa",
    "who owns tappa",
    "owner",
    "run by",
    "entrepreneur"
  ])) {

    remember("business");

    return "Tappa is a young Aotearoa-owned business run by a young entrepreneur, with the goal of helping local businesses make getting Google reviews easier. 🇳🇿";

  }


  /* =========================
     PHONE COMPATIBILITY
  ========================= */

  if (hasAny(text, [
    "iphone",
    "android",
    "samsung",
    "compatible",
    "compatibility",
    "what phones",
    "which phones",
    "work on my phone"
  ])) {

    remember("phones");

    return "Tappa uses NFC, which is supported by many modern smartphones. 📱\n\nIf you're unsure about a particular phone, contact us and we can help check.";

  }


  /* =========================
     SETUP
  ========================= */

  if (hasAny(text, [
    "setup",
    "set up",
    "program",
    "programmed",
    "configure",
    "configuration"
  ])) {

    remember("setup");

    return "We'll help get your Tappa card set up with the correct Google Review link for your business. 👍\n\nWe prefer to meet beforehand so we can make sure everything is working properly.";

  }


  /* =========================
     LOCAL BUSINESS
  ========================= */

  if (hasAny(text, [
    "dairy",
    "shop",
    "restaurant",
    "cafe",
    "business",
    "company",
    "store"
  ])) {

    remember("business");

    return "Tappa can be useful for lots of local businesses that want to make it easier for customers to leave Google reviews. ⭐\n\nWe'd prefer to meet you first and see what would work best for your business.";

  }


  /* =========================
     GOODBYE
  ========================= */

  if (hasAny(text, [
    "bye",
    "goodbye",
    "see ya",
    "see you"
  ])) {

    return "Ka kite! 👋 Thanks for checking out Tappa.";

  }


  /* =========================
     FALLBACK
  ========================= */

  return tappa.fallback;

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

  const input = document.getElementById("userInput");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  showTyping();

  setTimeout(function() {

    hideTyping();

    const reply = getResponse(text);

    addMessage(reply, "bot");

  }, 600);

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

  const messages = document.getElementById("messages");

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;

}


/* =========================
   TYPING
========================= */

function showTyping() {

  document.getElementById("typing").style.display = "block";

}


function hideTyping() {

  document.getElementById("typing").style.display = "none";

}


/* =========================
   QUICK QUESTIONS
========================= */

function quickQuestion(question) {

  document.getElementById("userInput").value = question;

  sendMessage();

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("userInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
